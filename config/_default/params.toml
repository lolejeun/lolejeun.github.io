# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon = "favicon.png"

[footer]
since = 2018
customText = ""

[dateFormat]
published = "Jan 02, 2018"
lastUpdated = "Nov 02, 2025 15:04 MST"

[sidebar]
emoji = "🌊"
subtitle = "Méditer chaque jour 🧘‍♀️ Marcher, Oser, Contempler🎐 Vivre, Aimer, Partager ✨"

[sidebar.avatar]
enabled = true
local = true
src = "/img/profileMINI2.jpg"

[article]
headingAnchor = false
math = false
readingTime = true

[article.license]
enabled = true
default = "Licensed under CC BY-NC-SA 4.0"

## Widgets
[[widgets.homepage]]
type = "search"

#[[widgets.homepage]]
#type = "archives"

[widgets.homepage.params]
limit = 5

[[widgets.homepage]]
type = "categories"

[widgets.homepage.params]
limit = 10

[[widgets.homepage]]
type = "tag-cloud"

[widgets.homepage.params]
limit = 10

[[widgets.page]]
type = "toc"

[opengraph.twitter]
site = ""
card = "summary_large_image"

[defaultImage.opengraph]
enabled = false
local = false
src = ""

[colorScheme]
toggle = true
default = "auto"

[imageProcessing.cover]
enabled = true

[imageProcessing.content]
enabled = true
