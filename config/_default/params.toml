# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon = "img/favicon.png"

[footer]
since = 2018
customText = "Habiter la joie"

[dateFormat]
published = "Jan 02, 2006"
lastUpdated = "Mon Jan 2 15:04:05 MST 2006"
#timeZone = "Europe/Paris"

[sidebar]
emoji = "🌊"
subtitle = "Méditer chaque jour 🧘‍♀️ Marcher, Oser, Contempler🎐 Vivre, Aimer, Partager ✨"
avatar = "img/profileMINI2.jpg"


[article]
headingAnchor = false
math = false
readingTime = true

[article.license]
enabled = true
default = "Licensed under CC BY-NC-SA 4.0"

## Widgets
[[widgets.homepage]]
type = "search"

#[[widgets.homepage]]
#type = "archives"

[widgets.homepage.params]
limit = 5

[[widgets.homepage]]
type = "categories"

[widgets.homepage.params]
limit = 10

[[widgets.homepage]]
type = "tag-cloud"

[widgets.homepage.params]
limit = 10

[[widgets.page]]
type = "toc"

[opengraph.twitter]
site = ""
card = "summary_large_image"

[defaultImage.opengraph]
enabled = false
local = false
src = ""

[colorScheme]
toggle = true
default = "auto"

[imageProcessing.cover]
enabled = true

[imageProcessing.content]
enabled = true
